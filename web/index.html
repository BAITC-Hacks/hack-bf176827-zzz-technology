<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Граф денег</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#17243b;background:#f4f6fa}header{padding:18px 24px;background:white;border-bottom:1px solid #dce2ec}h1{font-size:22px;margin:0 0 12px}h2{font-size:18px}button,input,select{font:inherit;padding:9px;border:1px solid #c9d2e0;border-radius:6px;background:white}button{cursor:pointer}button:hover{background:#edf2ff}button.primary{background:#244ed8;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input{min-width:240px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 170px);min-height:450px}#graph{position:relative;min-width:0}aside{overflow:auto;background:white;border-left:1px solid #dce2ec;padding:20px}#status{padding-top:10px;color:#58677d;font-size:12px}.gid{word-break:break-all;font-family:monospace}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #eef1f6;padding:7px 0}.neighbor{display:block;width:100%;text-align:left;margin:5px 0;font-size:12px}.empty{color:#63718a;line-height:1.7}.tag{color:#244ed8}#top-list button{display:block;width:100%;text-align:left;margin-bottom:6px}#busy{position:fixed;bottom:20px;left:24px;background:#17243b;color:white;padding:12px 18px;border-radius:8px;z-index:5}#busy[hidden]{display:none}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}#graph{height:60vh}aside{border-left:0;border-top:1px solid #ddd}header{padding:12px}}
</style></head>
<body><header><h1>Граф денег <span class="tag">/ исследование сети</span></h1><div class="toolbar"><input id="search" placeholder="Полный gid или начало номера" aria-label="Поиск по gid" list="suggestions"><datalist id="suggestions"></datalist><button id="find" class="primary">Найти</button><select id="role" aria-label="Роль"><option value="">Все роли</option></select><select id="cluster" aria-label="Кластер"><option value="">Все кластеры</option></select><button id="top">Топ-30</button><button id="all">Вся сеть</button><button id="fit">Вместить граф</button></div><div id="legend" class="legend"></div><div id="status" role="status">Загрузка…</div></header>
<main><div id="graph" aria-label="Сеть переводов"></div><aside><section id="card"><h2>Выберите узел</h2><p class="empty">Найдите gid или нажмите на узел графа.<br>Стрелки показывают направление переводов. Ромб — seed. Размер узла — приоритет.</p></section><h2>Топ приоритетов</h2><div id="top-list"></div><h2>Кластеры</h2><div id="cluster-list"></div><section id="assistant"><h2>Вопрос ассистенту</h2><form id="ask-form"><textarea id="question" rows="3" maxlength="2000" aria-label="Вопрос ассистенту" placeholder="Кто собирает деньги в этой группе?" required style="width:100%"></textarea><button id="ask-submit">Спросить</button></form><div id="answer" style="white-space:pre-wrap" role="status"></div></section></aside></main><div id="busy" hidden>Раскладываем сеть…</div>
<script src="vendor/cytoscape.min.js"></script><script src="mock/graph.js"></script>
<script src="app.js"></script></body></html>

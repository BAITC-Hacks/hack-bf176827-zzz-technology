version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repo/queries"
    schema: "migrations/postgres"
    gen:
      go:
        package: "db"
        out: "internal/repo/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true # db передаётся в каждый вызов → легко делать транзакции
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"

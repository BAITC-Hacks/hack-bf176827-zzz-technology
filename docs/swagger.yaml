basePath: /v1
definitions:
  assistantdto.AskRequest:
    properties:
      question:
        maxLength: 2000
        type: string
    required:
    - question
    type: object
  assistantdto.AskResponse:
    properties:
      answer:
        type: string
      cached:
        type: boolean
      gids:
        description: упомянутые gid — для подсветки на графе
        items:
          type: string
        type: array
      steps:
        type: integer
    type: object
  assistantdto.CardResponse:
    properties:
      by_llm:
        description: false — шаблон (нет ключа или LLM недоступен)
        type: boolean
      gid:
        type: string
      text:
        type: string
    type: object
  assistantdto.StatusResponse:
    properties:
      enabled:
        type: boolean
      model:
        type: string
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  graphdto.ClusterResponse:
    properties:
      component:
        type: integer
      hypothesis:
        type: string
      id:
        type: integer
      n_cycles:
        type: integer
      n_nodes:
        type: integer
      n_seed:
        type: integer
      roles:
        additionalProperties:
          type: integer
        type: object
      sum_kzt_in:
        type: number
      sum_kzt_internal:
        type: number
      sum_kzt_out:
        type: number
      top_gids:
        items:
          type: string
        type: array
    type: object
  graphdto.EdgeResponse:
    properties:
      n_tx:
        type: integer
      source:
        type: string
      sum_kzt:
        type: number
      target:
        type: string
    type: object
  graphdto.FeaturesResponse:
    properties:
      active_days:
        type: integer
      authority:
        type: number
      avg_in_tx:
        type: number
      avg_out_tx:
        type: number
      betweenness:
        type: number
      component_id:
        type: integer
      component_size:
        type: integer
      depth:
        type: integer
      fast_forward_share:
        type: number
      hub:
        type: number
      in_cycle:
        type: boolean
      in_deg:
        type: integer
      in_kzt:
        type: number
      in_tx:
        type: integer
      is_seed:
        type: boolean
      max_same_day_payers:
        type: integer
      n_clusters_in:
        type: integer
      n_seed_payers:
        type: integer
      n_seed_upstream:
        type: integer
      out_deg:
        type: integer
      out_kzt:
        type: number
      out_tx:
        type: integer
      pagerank:
        type: number
      pass_through:
        type: number
      reciprocal:
        type: boolean
      repeat_routes:
        type: integer
      truncated:
        type: boolean
      verified_sink:
        type: boolean
    type: object
  graphdto.NeighborResponse:
    properties:
      gid:
        type: string
      n_tx:
        type: integer
      sum_kzt:
        type: number
    type: object
  graphdto.NodeCardResponse:
    properties:
      incoming:
        items:
          $ref: '#/definitions/graphdto.NeighborResponse'
        type: array
      node:
        $ref: '#/definitions/graphdto.NodeDetailResponse'
      outgoing:
        items:
          $ref: '#/definitions/graphdto.NeighborResponse'
        type: array
    type: object
  graphdto.NodeDetailResponse:
    properties:
      cluster:
        type: integer
      component:
        type: integer
      depth:
        type: integer
      evidence:
        type: string
      features:
        $ref: '#/definitions/graphdto.FeaturesResponse'
      id:
        type: string
      in_deg:
        type: integer
      in_kzt:
        type: number
      is_seed:
        type: boolean
      out_deg:
        type: integer
      out_kzt:
        type: number
      priority:
        type: number
      role:
        type: string
      role_score:
        type: number
      truncated:
        type: boolean
    type: object
  graphdto.NodeResponse:
    properties:
      cluster:
        type: integer
      component:
        type: integer
      depth:
        type: integer
      evidence:
        type: string
      id:
        type: string
      in_deg:
        type: integer
      in_kzt:
        type: number
      is_seed:
        type: boolean
      out_deg:
        type: integer
      out_kzt:
        type: number
      priority:
        type: number
      role:
        type: string
      role_score:
        type: number
      truncated:
        type: boolean
    type: object
  graphdto.SubgraphResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/graphdto.EdgeResponse'
        type: array
      nodes:
        items:
          $ref: '#/definitions/graphdto.NodeResponse'
        type: array
    type: object
  graphdto.TopNodeResponse:
    properties:
      gid:
        type: string
      priority:
        type: number
      rank:
        type: integer
      role:
        type: string
      why:
        type: string
    type: object
  httperr.Error:
    properties:
      field:
        description: поле запроса, если ошибка про него
        type: string
      msg:
        description: человекочитаемое сообщение
        example: Не найдено
        type: string
      status:
        description: машинный код для фронта
        example: not_found
        type: string
    type: object
  httperr.Response:
    properties:
      errors:
        items:
          $ref: '#/definitions/httperr.Error'
        type: array
    type: object
info:
  contact: {}
  description: Роли, кластеры и приоритеты узлов транзакционной сети (HackAlem AI).
  title: Граф денег — API
  version: "0.1"
paths:
  /assistant:
    post:
      consumes:
      - application/json
      description: Ответ строится через инструменты по результату анализа; в gids
        — упомянутые узлы для подсветки.
      operationId: assistant-ask
      parameters:
      - description: Вопрос
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantdto.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantdto.AskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httperr.Response'
        "503":
          description: LLM не настроен
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Вопрос по графу на естественном языке
      tags:
      - assistant
  /assistant/status:
    get:
      operationId: assistant-status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantdto.StatusResponse'
      summary: Доступен ли LLM-ассистент
      tags:
      - assistant
  /clusters:
    get:
      operationId: clusters
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/graphdto.ClusterResponse'
            type: array
      summary: Кластеры сети
      tags:
      - graph
  /graph:
    get:
      description: Вся сеть или top-N узлов с соседями; фильтры по роли, кластеру,
        компоненте.
      operationId: graph
      parameters:
      - description: Роль
        in: query
        name: role
        type: string
      - description: Кластер
        in: query
        name: cluster
        type: integer
      - description: Компонента
        in: query
        name: component
        type: integer
      - description: Топ N и соседи (0 — все)
        in: query
        name: top
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/graphdto.SubgraphResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Граф переводов
      tags:
      - graph
  /health:
    get:
      operationId: health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Проверка живости
      tags:
      - system
  /nodes/{gid}:
    get:
      operationId: node
      parameters:
      - description: GID клиента
        in: path
        name: gid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/graphdto.NodeCardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Карточка узла и контрагенты
      tags:
      - graph
  /nodes/{gid}/card:
    get:
      description: 'Четыре блока: роль и почему, потоки, связи, на что обратить внимание.
        Без ключа — шаблон (by_llm=false).'
      operationId: node-card
      parameters:
      - description: GID клиента
        in: path
        name: gid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantdto.CardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Справка по узлу
      tags:
      - assistant
  /nodes/{gid}/ego:
    get:
      operationId: node-ego
      parameters:
      - description: GID клиента
        in: path
        name: gid
        required: true
        type: string
      - default: 1
        description: Глубина
        enum:
        - 1
        - 2
        in: query
        name: depth
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/graphdto.SubgraphResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Окружение узла в один или два шага
      tags:
      - graph
  /search:
    get:
      operationId: search
      parameters:
      - description: Префикс GID
        in: query
        name: q
        type: string
      - default: 10
        description: Лимит
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/graphdto.NodeDetailResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Поиск по началу GID
      tags:
      - graph
  /top:
    get:
      operationId: top
      parameters:
      - default: 30
        description: Число узлов
        in: query
        name: "n"
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/graphdto.TopNodeResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Топ приоритетов
      tags:
      - graph
swagger: "2.0"

basePath: /v1
definitions:
  assistantdto.AskRequest:
    properties:
      question:
        maxLength: 2000
        type: string
    required:
    - question
    type: object
  assistantdto.AskResponse:
    properties:
      answer:
        type: string
      cached:
        type: boolean
      gids:
        description: упомянутые gid — для подсветки на графе
        items:
          type: string
        type: array
      steps:
        type: integer
    type: object
  assistantdto.CardResponse:
    properties:
      by_llm:
        description: false — шаблон (нет ключа или LLM недоступен)
        type: boolean
      gid:
        type: string
      text:
        type: string
    type: object
  assistantdto.StatusResponse:
    properties:
      enabled:
        type: boolean
      model:
        type: string
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httperr.Error:
    properties:
      field:
        description: поле запроса, если ошибка про него
        type: string
      msg:
        description: человекочитаемое сообщение
        example: Не найдено
        type: string
      status:
        description: машинный код для фронта
        example: not_found
        type: string
    type: object
  httperr.Response:
    properties:
      errors:
        items:
          $ref: '#/definitions/httperr.Error'
        type: array
    type: object
info:
  contact: {}
  description: Роли, кластеры и приоритеты узлов транзакционной сети (HackAlem AI).
  title: Граф денег — API
  version: "0.1"
paths:
  /assistant:
    post:
      consumes:
      - application/json
      description: Ответ строится через инструменты по результату анализа; в gids
        — упомянутые узлы для подсветки.
      operationId: assistant-ask
      parameters:
      - description: Вопрос
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantdto.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantdto.AskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httperr.Response'
        "503":
          description: LLM не настроен
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Вопрос по графу на естественном языке
      tags:
      - assistant
  /assistant/status:
    get:
      operationId: assistant-status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantdto.StatusResponse'
      summary: Доступен ли LLM-ассистент
      tags:
      - assistant
  /health:
    get:
      operationId: health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Проверка живости
      tags:
      - system
  /nodes/{gid}/card:
    get:
      description: 'Четыре блока: роль и почему, потоки, связи, на что обратить внимание.
        Без ключа — шаблон (by_llm=false).'
      operationId: node-card
      parameters:
      - description: GID клиента
        in: path
        name: gid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistantdto.CardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.Response'
      summary: Справка по узлу
      tags:
      - assistant
swagger: "2.0"

<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, DejaVu Sans, Noto Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a39e98"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.02"/>
    </filter>
    <style>
      .h1 { font-size: 40px; font-weight: 700; fill: #000000; letter-spacing: -1px; }
      .lead { font-size: 16px; fill: #615d59; }
      .h3 { font-size: 22px; font-weight: 700; fill: #000000; letter-spacing: -0.25px; }
      .eyebrow { font-size: 12px; font-weight: 600; fill: #0075de; letter-spacing: 0.125px; }
      .body { font-size: 14px; fill: #31302e; }
      .strong { font-size: 14px; font-weight: 600; fill: #000000; }
      .cap { font-size: 13px; fill: #615d59; }
      .faint { font-size: 13px; fill: #a39e98; }
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #31302e; }
      .card { fill: #ffffff; stroke: #e6e6e6; stroke-width: 1; rx: 12; }
      .well { fill: #f6f5f4; stroke: #e6e6e6; stroke-width: 1; rx: 8; }
      .pill { fill: #ffffff; stroke: #e6e6e6; stroke-width: 1; rx: 9999; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f5f4"/>

  <text x="60" y="76" class="h1">Граф денег: данные → метрики → роли → интерфейс</text>
  <text x="60" y="106" class="lead">Один запуск от трёх parquet до трёх CSV и экрана аналитика. Правила с порогами, детерминировано, без БД, меньше секунды.</text>

  <!-- 1. Данные -->
  <rect x="60" y="150" width="345" height="460" class="card" filter="url(#soft)"/>
  <rect x="84" y="174" width="52" height="22" class="pill"/><text x="94" y="189" class="eyebrow">ШАГ 1</text>
  <circle cx="380" cy="185" r="7" fill="#62aef0"/>
  <text x="84" y="230" class="h3">Данные</text>
  <text x="84" y="266" class="mono">edges.parquet      3 119</text>
  <text x="84" y="288" class="mono">nodes.parquet      2 248</text>
  <text x="84" y="310" class="mono">transactions       4 840</text>
  <text x="84" y="344" class="body">81 seed → исходящие переводы, 4 колена,</text>
  <text x="84" y="364" class="body">июль 2026, порог ≥ 5 000 KZT</text>
  <text x="84" y="394" class="cap">internal/repo/dataset · parquet → models</text>
  <rect x="84" y="416" width="297" height="170" class="well"/>
  <text x="100" y="442" class="strong">Ловушки учтены</text>
  <text x="100" y="468" class="body">• 444 узла 4-го колена обрезаны,</text>
  <text x="112" y="488" class="body">а не «деньги осели» (truncated)</text>
  <text x="100" y="512" class="body">• 1 091 сток подтверждён обходом:</text>
  <text x="112" y="532" class="body">дальше переводов нет (verified_sink)</text>
  <text x="100" y="556" class="body">• у seed входящие занижены</text>
  <text x="100" y="576" class="body">• 16 компонент, 19 seed без рёбер</text>

  <!-- 2. Метрики -->
  <rect x="445" y="150" width="345" height="460" class="card" filter="url(#soft)"/>
  <rect x="469" y="174" width="52" height="22" class="pill"/><text x="479" y="189" class="eyebrow">ШАГ 2</text>
  <circle cx="765" cy="185" r="7" fill="#d6b6f6"/>
  <text x="469" y="230" class="h3">Метрики узла</text>
  <text x="469" y="264" class="body">Направленный взвешенный граф</text>
  <text x="469" y="284" class="cap">gonum, вес ребра = сумма перевода</text>
  <text x="469" y="318" class="body">• in/out: плательщики, получатели,</text>
  <text x="481" y="338" class="body">суммы, число переводов, pass_through</text>
  <text x="469" y="364" class="body">• PageRank (взвеш.), HITS, betweenness</text>
  <text x="469" y="390" class="body">• seed upstream ≤ 4 шагов, seed payers</text>
  <text x="469" y="416" class="body">• даты: транзит ≤ 2 дней, синхронные</text>
  <text x="481" y="436" class="body">плательщики, активные дни</text>
  <text x="469" y="462" class="body">• циклы ≤ 5, устойчивые маршруты A→B→C</text>
  <text x="469" y="488" class="body">• Louvain на неориентированной проекции</text>
  <text x="481" y="508" class="body">→ 88 кластеров, 8 с несколькими seed</text>
  <text x="469" y="548" class="cap">internal/services/analysis · metrics, clusters, patterns</text>
  <text x="469" y="572" class="cap">Детерминизм: свой PageRank, округление,</text>
  <text x="469" y="590" class="cap">сортировка по GID</text>

  <!-- 3. Роли и приоритет -->
  <rect x="830" y="150" width="345" height="460" class="card" filter="url(#soft)"/>
  <rect x="854" y="174" width="52" height="22" class="pill"/><text x="864" y="189" class="eyebrow">ШАГ 3</text>
  <circle cx="1150" cy="185" r="7" fill="#dd5b00"/>
  <text x="854" y="230" class="h3">Роли и приоритет</text>
  <text x="854" y="264" class="body">Скор 0–1 по правилу с порогом,</text>
  <text x="854" y="284" class="body">роль = argmax, peripheral = 1 − max</text>
  <text x="854" y="318" class="mono">consolidator  in ≥ 3, удерживает</text>
  <text x="854" y="340" class="mono">distributor   out ≥ 5, веер</text>
  <text x="854" y="362" class="mono">transit       0.7 ≤ out/in ≤ 1.3</text>
  <text x="854" y="384" class="mono">coordinator   btw ≥ P97, ≥ 2 кластера</text>
  <text x="854" y="406" class="mono">terminal      verified_sink</text>
  <text x="854" y="428" class="mono">peripheral    иначе</text>
  <text x="854" y="462" class="body">priority = перцентили: сумма 0.25,</text>
  <text x="854" y="482" class="body">плательщики 0.20, seed выше 0.15,</text>
  <text x="854" y="502" class="body">PageRank 0.15, btw 0.10, роль 0.15,</text>
  <text x="854" y="522" class="body">seed × 0.5, обрезанные × 0.7</text>
  <text x="854" y="550" class="body">evidence ≤ 200 символов, с числами</text>
  <text x="854" y="578" class="cap">LLM (опционально, gpt-5.1): гипотезы кластеров,</text>
  <text x="854" y="596" class="cap">справка по узлу, вопросы по графу. Всё в кэше.</text>

  <!-- 4. Выход и интерфейс -->
  <rect x="1215" y="150" width="325" height="460" class="card" filter="url(#soft)"/>
  <rect x="1239" y="174" width="52" height="22" class="pill"/><text x="1249" y="189" class="eyebrow">ШАГ 4</text>
  <circle cx="1515" cy="185" r="7" fill="#2a9d99"/>
  <text x="1239" y="230" class="h3">Выход и интерфейс</text>
  <rect x="1239" y="248" width="277" height="112" class="well"/>
  <text x="1255" y="274" class="mono">nodes_roles.csv   2 248</text>
  <text x="1255" y="296" class="mono">clusters.csv         88</text>
  <text x="1255" y="318" class="mono">top_nodes.csv    топ-30</text>
  <text x="1255" y="340" class="mono">graph.json       для UI</text>
  <text x="1239" y="388" class="body">API: /v1/graph, /nodes/{gid}, /top,</text>
  <text x="1239" y="408" class="body">/clusters, /search, /assistant, /card</text>
  <text x="1239" y="440" class="body">UI (cytoscape.js): стрелки = деньги,</text>
  <text x="1239" y="460" class="body">цвет = роль, поиск по gid, карточка узла,</text>
  <text x="1239" y="480" class="body">топ-лист, устойчивость сети</text>
  <rect x="1239" y="506" width="277" height="30" class="pill"/>
  <text x="1253" y="526" class="eyebrow">КОГО СМОТРЕТЬ ПЕРВЫМ И ПОЧЕМУ</text>
  <text x="1239" y="568" class="cap">make demo · docker compose up</text>
  <text x="1239" y="588" class="cap">без интернета и без ключа, &lt; 1 с</text>

  <!-- стрелки -->
  <line x1="409" y1="380" x2="440" y2="380" stroke="#a39e98" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="794" y1="380" x2="825" y2="380" stroke="#a39e98" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1179" y1="380" x2="1210" y2="380" stroke="#a39e98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- итог -->
  <rect x="60" y="646" width="1480" height="196" class="card" filter="url(#soft)"/>
  <text x="84" y="684" class="h3">Что получает аналитик</text>
  <text x="84" y="720" class="body">• Топ-30 узлов с обоснованием: сверху точки консолидации и координаторы, ни одного seed в первой десятке. Фокус смещён с курьеров на тех, кто выше.</text>
  <text x="84" y="748" class="body">• Роль каждого из 2 248 узлов объяснима за минуту по колонкам CSV: in_deg, out_deg, pass_through, n_seed_upstream, betweenness.</text>
  <text x="84" y="776" class="body">• Кластеры с гипотезами («ячейка с общим сборщиком», «цепочка прогона»). Устойчивость: изъятие топ-20 отрезает 17 % оборота и дробит сеть 16 → 75 компонент.</text>
  <text x="84" y="804" class="body">• Все выводы — гипотезы для проверки, не утверждения о виновности. Данные обезличены, атрибуты клиентов не используются.</text>
  <text x="84" y="828" class="faint">Go 1.25 · Fiber · gonum · OpenAI опционально · воспроизводимо на чистой машине одной командой</text>
</svg>

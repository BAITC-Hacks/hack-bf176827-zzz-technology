# Несекретные настройки. Overlay: config/<APP_ENVIRONMENT>.yaml.
# Любой ключ переопределяется env-переменной: app.port → APP_PORT, postgres.host → POSTGRES_HOST.
# Секреты (POSTGRES_PASSWORD) — только из env / .env.
app:
  name: hackaton
  port: 8080
  log_level: info
  cors_origins:
    - "*"
  cors_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization

postgres:
  host: localhost
  port: 5442
  user: hack
  db: hackaton
  ssl_mode: disable
  auto_migrate: true # goose up при старте (миграции вшиты в бинарь)

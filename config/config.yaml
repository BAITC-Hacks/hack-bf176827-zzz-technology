# Несекретные настройки. Любой ключ переопределяется env-переменной: app.port → APP_PORT, app.debug → APP_DEBUG.
# Секреты (OPENAI_API_KEY) — только из env / .env.
app:
  name: money-graph
  port: 8080
  debug: false # true → цветные dev-логи и стектрейсы паник в ответе; APP_DEBUG=true
  log_level: info
  data_dir: data
  out_dir: out
  cors_origins:
    - "*"
  cors_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization

llm:
  model: gpt-5.1
  base_url: https://api.openai.com/v1

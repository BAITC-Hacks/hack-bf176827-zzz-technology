services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./out:/app/out
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./out:/data:ro
    depends_on:
      app:
        condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: hackaton
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d hackaton"]
      interval: 2s
      timeout: 3s
      retries: 20

  # API в контейнере — `make up` (profile app). Для разработки бэкенда удобнее `make run`.
  api:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: hack

volumes:
  pgdata:

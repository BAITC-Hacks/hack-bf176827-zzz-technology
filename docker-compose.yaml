# docker compose up --build  →  http://localhost:8080 (интерфейс, API, swagger)
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./out:/app/out # выгрузки CSV появляются на хосте; здесь же кэш LLM
